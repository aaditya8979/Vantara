services:
  - type: web
    name: vantara-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      # IMPORTANT: Add your Gemini API Key in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
    rootDir: backend
